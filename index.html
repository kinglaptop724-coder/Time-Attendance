<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบลงเวลาทำงานของคุณครู</title>
<meta name="theme-color" content="#6C5CE7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ลงเวลาครู">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#6C5CE7;color:#fff;font-family:system-ui,sans-serif;text-align:center}
  .box{padding:24px;max-width:420px}
  .spin{width:44px;height:44px;margin:0 auto 14px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  p{margin:10px 0;line-height:1.6}
  button{background:#fff;color:#4F3FD6;border:0;border-radius:12px;padding:10px 20px;font-size:16px;font-weight:600}
  code{font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><p>กำลังโหลด...</p></div>

<script>
/* ไฟล์นี้เป็น "เปลือก" — ไม่ต้องแก้อีก
   หน้าเว็บตัวจริงอยู่ใน Apps Script (ไฟล์ Index.html) แก้ที่นั่นที่เดียว
   ใส่ URL ของ Web app (ลงท้ายด้วย /exec) แค่ครั้งเดียวตรงนี้ */
(function () {
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyXw64ppvKWXcrnFOEvqolabK82ByTxqmLodhmx9LBl3UAsY3Uwiqn7n7Wc92tNwfw/exec';
  var KEY = 'teacher_page_cache_v1';

  // Service Worker: ทำให้เบราว์เซอร์ยอมให้ติดตั้งเป็นแอปได้
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}

  var cached = null;
  try { cached = localStorage.getItem(KEY); } catch (e) {}

  function render(html) {
    window.__API_URL = APPS_SCRIPT_URL;
    document.open(); document.write(html); document.close();
  }
  function fail(msg) {
    document.getElementById('box').innerHTML =
      '<p>เปิดระบบไม่ได้ชั่วคราว</p><p><code></code></p><button onclick="location.reload()">ลองใหม่</button>';
    document.querySelector('code').textContent = msg;
  }
  // ดึงหน้าล่าสุดจาก Apps Script
  function fetchPage(onOk, onErr) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    fetch(APPS_SCRIPT_URL + '?api=page&t=' + Date.now(), ctl ? { signal: ctl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(timer);
        if (!j || !j.ok || !j.html) throw new Error((j && j.error) || 'ไม่ได้รับหน้าเว็บจาก Apps Script');
        onOk(j.html);
      })
      .catch(function (e) { clearTimeout(timer); onErr(String((e && e.message) || e)); });
  }
  function save(html) { try { localStorage.setItem(KEY, html); } catch (e) {} }

  if (!APPS_SCRIPT_URL || /^PASTE_/.test(APPS_SCRIPT_URL)) { fail('ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL ใน index.html'); return; }

  if (cached) {
    // เปิดทันทีจากหน้าที่จำไว้ แล้วอัปเดตเบื้องหลัง (ครั้งถัดไปจะเห็นเวอร์ชันใหม่)
    render(cached);
    setTimeout(function () { fetchPage(save, function () {}); }, 1500);
  } else {
    // เปิดครั้งแรก: ต้องรอโหลดจาก Apps Script
    fetchPage(function (html) { save(html); render(html); }, fail);
  }
})();
</script>
</body>
</html>
